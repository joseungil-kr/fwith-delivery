{{ $site := .Site.Data.site.site }}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .Title }}</title>
<meta name="description" content="{{ .Description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="index,follow,max-image-preview:large">
{{ with $site.site_verification.naver }}<meta name="naver-site-verification" content="{{ . }}">{{ end }}

<meta property="og:type" content="website">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:image" content="{{ $site.domain | printf "https://%s/img/og-default.jpg" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="꽃이랑 근조화환">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

{{ $css := resources.Get "css/main.css" | minify }}
<style>{{ $css.Content | safeCSS }}</style>

{{ partial "jsonld.html" . }}
